# Package description for mkdeb (https://github.com/tetronos/tetron-packaging).
# Built in release CI by the build-deb action. Paths are relative to this file.
#
# Only the binary: `tetron-systray install`, run as the user, registers the service
# with the binary's own path, as it does for a downloaded binary.
name = "tetron-systray"
description = "Tray icon with tetron mesh VPN status and quick actions"
long_description = """
Tray icon for a graphical desktop session: shows whether the tetron mesh
VPN is connected and offers quick actions. Talks to the local tetron daemon
over its Unix socket, so the tetron daemon must be installed and running on
the same host.

Run `tetron-systray install` as your user to start it with your desktop
session (a systemd user service)."""
section = "net"
license = "MPL-2.0"
homepage = "https://github.com/tetronos/tetron-systray"
# tetron-systray X.Y.z targets tetron core X.Y, so recommend that minor only.
recommends = ["tetron (>= {minor}), tetron (<< {next_minor})"]
# The tray library loads the appindicator library at runtime, so it is not in
# the binary's linked libraries; GTK, GLib and libxdo are mapped by soname.
# The old package names resolve on Debian 13 and Ubuntu 24.04 too, where the
# renamed t64 packages provide them.
depends = ["libayatana-appindicator3-1 | libappindicator3-1"]
soname_map = { "libxdo.so.3" = "libxdo3", "libgtk-3.so.0" = "libgtk-3-0", "libgdk-3.so.0" = "libgtk-3-0", "libgdk_pixbuf-2.0.so.0" = "libgdk-pixbuf-2.0-0", "libgio-2.0.so.0" = "libglib2.0-0", "libgobject-2.0.so.0" = "libglib2.0-0", "libglib-2.0.so.0" = "libglib2.0-0" }
smoke = "tetron-systray --version"

[[files]]
src = "binary"
dst = "usr/bin/tetron-systray"
mode = "0755"

[[files]]
src = "../README.md"
dst = "usr/share/doc/tetron-systray/README.md"
mode = "0644"
