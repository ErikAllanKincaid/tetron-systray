<?xml version="1.0" encoding="UTF-8"?>
<!--
  tetron-systray app icon: a green status dot with a capital "T" glyph.
  Reproduced from the tray icon's own generator (src/main.rs's solid_icon()/
  icon_for()) so this vector matches the raster tray icon exactly, geometry
  and color both -- not a fresh redraw. Canvas, circle radius/center, and
  glyph bar/stem coordinates are copied directly from those pixel constants
  (32x32 grid, center at 15.5,15.5, radius 12; stem half-width 1.75 spanning
  y 11..23; bar half-width 5.5 spanning y 8..11). Color is the "active"
  state's green (#4CAF50, matches webui --status-active) with a white glyph,
  the canonical resting state of the mark -- the tray icon also has grey
  (standby) and red (unreachable) variants, not reproduced here since this
  file is meant as the one reusable brand mark, not a state-swap set.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <circle cx="15.5" cy="15.5" r="12" fill="#4CAF50"/>
  <rect x="10" y="8" width="11" height="3" fill="#FFFFFF"/>
  <rect x="13.75" y="11" width="3.5" height="12" fill="#FFFFFF"/>
</svg>
